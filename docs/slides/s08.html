<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>S8 시연영상</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="slide.css">
<style>
.slide{padding:0;gap:0}
.bar8{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid var(--line)}
.bar8 b{font-size:30px}
.bar8 span{font-size:20px;color:var(--ink2)}
.video{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:40px;background:repeating-linear-gradient(135deg,#101A25 0 24px,#0E1620 24px 48px)}
.video .ph{font-size:34px;color:var(--ink2)}
.cuts{display:grid;grid-template-columns:12fr 13fr 17fr 12fr 6fr;width:1680px;gap:6px}
.cuts div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--amber);padding:14px 16px;font-size:19px;line-height:1.45;color:var(--ink2)}
.cuts b{display:block;font-family:"IBM Plex Mono",monospace;color:var(--amber);font-size:18px;margin-bottom:4px}
</style>
</head><body>
<div class="slide">
  <div class="bar8"><b>시연: 항공사진부터 시민 투자까지</b><span>② AI 구현 · 60초</span></div>
  <div class="video">
    <div class="ph">▶ 시연영상 자리 (1920×1080, 녹화 후 교체)</div>
    <div class="cuts">
      <div><b>0:00–0:12</b>항공사진 위에 AI가 설치 가능 지붕·구조물을 칠함</div>
      <div><b>0:12–0:25</b>패널이 깔리며 kW가 올라감 (중구청 153kW)</div>
      <div><b>0:25–0:42</b>발전량 → 수익 → 설치비 → SPC 자금 → DSCR</div>
      <div><b>0:42–0:54</b>102곳 20.6MW → 상품 고르기 → 15년 이자·원금</div>
      <div><b>0:54–1:00</b>3D 지도 한 컷</div>
    </div>
  </div>
</div>
</body></html>
