<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>S4 지붕 AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="slide.css">
<style>
/* 4장만 밝은 색 (5장과 같은 값) */
.slide{--bg:#F6F7F9;--ink:#14202B;--ink2:#566473;--amber:#C9770F;--blue:#3A78AD;--warn:#B4541C;--line:#D8DFE6;--card:#FFFFFF;background:var(--bg);color:var(--ink)}
.slide .img{background:#E7ECF1}
.slide{gap:24px}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1;min-height:0}
.pics>div{display:flex;flex-direction:column;min-height:0}
.pics .img{flex:1;min-height:0}
.pics .cap{font-size:21px;margin-top:12px}
.pics .cap b{display:block;color:var(--ink);font-size:27px;margin-bottom:2px}
.vars{display:flex;gap:28px;flex-wrap:wrap;font-size:19px;color:var(--ink2)}
.vars b{color:var(--ink);font-weight:600}
.flow .st span{word-break:keep-all}
</style>
</head><body>
<div class="slide">
  <div class="part">② 지붕 AI</div>
  <h1>지붕 AI로 재 보면, 중구청 옥상에는<br><span class="hl">패널 270장(153kW)</span>을 설치할 수 있습니다</h1>

  <div class="pics">
    <div><div class="img"><img src="img/junggu_orig.png" alt="중구청 항공사진"></div><div class="cap"><b>1 항공사진</b> 대전 중구청 (브이월드)</div></div>
    <div><div class="img"><img src="img/junggu_seg.png" alt="AI 지붕 분할"></div><div class="cap"><b>2 AI 분할</b> 파랑 = 설치 가능, 노랑 = 옥탑·실외기</div></div>
    <div><div class="img"><img src="img/junggu_panel.png" alt="패널 배치"></div><div class="cap"><b>3 패널 배치</b> 빨강 = 그늘 · 270장 × 패널 1장 0.57kW = <span class="hl" style="font-weight:700">153kW</span></div></div>
  </div>

  <div class="flow">
    <div class="st"><b>학습</b><span>AI Hub 태양광 적지분석 항공사진 2,336장</span></div>
    <div class="ar">→</div>
    <div class="st"><b>경계 맞추기</b><span>건물 윤곽을 사진에 맞추고, 어긋난 곳은 직접 수정</span></div>
    <div class="ar">→</div>
    <div class="st"><b>그늘</b><span>1년 동안 그늘지는 곳을 빼고, 패널끼리 그늘이 안 지게 간격</span></div>
    <div class="ar">→</div>
    <div class="st"><b>배치</b><span>가장자리·옥탑 주변을 띄우고 패널을 배치</span></div>
  </div>

</div>
</body></html>
