<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>S1 표지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="slide.css">
<style>
/* 밝은 색 (2~6장과 같은 값, 이 장 안에서만) */
.slide{--bg:#F6F7F9;--ink:#14202B;--ink2:#566473;--amber:#C9770F;--blue:#3A78AD;--warn:#B4541C;--line:#D8DFE6;--card:#FFFFFF;background:var(--bg);color:var(--ink)}
.slide .empty{border-color:#C3CDD7;background:#fff}
.slide .tag.ok{color:#1F7A5A;border-color:#B9DCCB}
.slide .img{background:#E7ECF1}

.cover{justify-content:center;gap:0;padding:120px 160px}
.cover .kicker{font-size:26px;color:var(--amber);font-weight:700;letter-spacing:.04em}
.cover h1{font-size:92px;font-weight:900;line-height:1.18;margin-top:28px;max-width:none}
.cover .sub{font-size:34px;margin-top:36px;color:var(--ink2)}
.cover .rule{width:180px;height:6px;background:var(--amber);margin-top:56px}
.cover .meta{display:flex;gap:48px;margin-top:40px;font-size:26px;color:var(--ink2)}
.cover .meta b{color:var(--ink);font-weight:700}
</style>
</head><body>
<div class="slide cover">
  <div class="kicker">DSC 공유대학 × KT · AI 활용 지역문제 해결</div>
  <h1>대전 공공건물 지붕 태양광<br><span class="hl">적지분석 AI</span> + 시민펀드</h1>
  <p class="sub">항공사진으로 실제 설치 가능 면적을 재고, 시민이 참여하는 SPC로 재원을 모읍니다</p>
  <div class="rule"></div>
  <div class="meta"><span><b>팀명</b> (추가 예정)</span><span><b>팀원</b> (추가 예정)</span></div>
</div>
</body></html>
