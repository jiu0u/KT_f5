.slide{--bg:#F6F7F9;--ink:#14202B;--ink2:#566473;--amber:#C9770F;--blue:#3A78AD;--warn:#B4541C;--line:#D8DFE6;--card:#FFFFFF;background:var(--bg);color:var(--ink);padding:70px 90px 40px;gap:18px}
h1{font-size:50px}
.sub{margin-top:-10px;font-size:23px}
.cols{display:grid;grid-template-columns:1fr 1.3fr 1.15fr;gap:22px;flex:1;min-height:0}
.col{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-height:0}
.col h2{font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:2px}
.col h2 i{font:600 16px &quot;IBM Plex Mono&quot;,monospace;font-style:normal;width:30px;height:30px;border-radius:8px;background:#E9EEF4;color:var(--blue);display:grid;place-items:center}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:#F8FAFC}
.box b{display:block;font-size:20px}
.box span{font-size:16px;color:var(--ink2);line-height:1.5}
/* 1 자금 */
.who{display:grid;grid-template-columns:1fr auto;align-items:center}
.who .p{font:700 22px &quot;IBM Plex Mono&quot;,monospace}
.who.eq{background:#E8F4EF;border-color:#B9DCCB}.who.eq b,.who.eq .p{color:#1F7A5A}
.who.pf{background:#EAF1F8;border-color:#BDD3E8}.who.pf b,.who.pf .p{color:#2C5F8E}
.who.ct{background:#FDF3E3;border-color:#F0D3A6}.who.ct b,.who.ct .p{color:#A9620A}
.sbar{display:grid;grid-template-columns:20fr 65fr 15fr;height:12px;border-radius:6px;overflow:hidden;margin-top:4px}
.sbar i:nth-child(1){background:#1F7A5A}.sbar i:nth-child(2){background:#2C5F8E}.sbar i:nth-child(3){background:#D99A2B}
.slab{display:grid;grid-template-columns:20fr 65fr 15fr;font-size:15px;color:var(--ink2)}
.slab span:nth-child(2){text-align:center}.slab span:nth-child(3){text-align:right}
.lab{font-size:17px;font-weight:700;color:var(--ink2)}
.scale{background:#17304A;color:#fff;border-radius:12px;padding:14px 18px}
.scale small{display:block;font-size:15px;opacity:.85}
.scale .n{font-size:44px;font-weight:700;line-height:1.2}
.scale .d{font-size:15px;opacity:.9}
.memo{font-size:15px;color:var(--ink2);line-height:1.55;background:#F3F5F8;border-radius:10px;padding:10px 14px}
/* 2 수익 */
.flow2{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center}
.flow2 em{font-style:normal;color:var(--ink2);font-size:22px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wf div{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:16px;background:#fff}
.wf div i{font:600 13px &quot;IBM Plex Mono&quot;,monospace;font-style:normal;width:22px;height:22px;border-radius:6px;background:#E9EEF4;color:var(--blue);display:grid;place-items:center;flex:none}
.wf div.w{grid-column:span 2}
/* 3 상환 */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi div{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font:600 30px &quot;IBM Plex Mono&quot;,monospace;color:var(--ink)}
.kpi span{font-size:15px;color:var(--ink2)}
.tl{display:grid;gap:8px}
.tl div{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;font-size:16px;color:var(--ink2);line-height:1.45}
.tl div b{background:#E9EEF4;color:#2C5F8E;border-radius:8px;padding:8px 6px;text-align:center;font-size:15px}
.tl div strong{color:var(--ink)}
.risk{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:#FDF3E3;border:1px solid #F0D3A6;border-radius:12px;padding:12px 22px;font-size:16px;color:var(--ink2)}
.risk b{font-size:19px;color:#A9620A}
&lt;/style&gt;
&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;slide&quot;&gt;
  &lt;div class=&quot;part&quot;&gt;③ 재원&lt;/div&gt;
  &lt;h1&gt;대전햇빛발전 SPC 펀드 구조&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;공공건물 태양광을 SPC가 설치·운영하고, 발전수익으로 금융비용을 상환한 뒤 공공에 환원하는 구조&lt;/p&gt;

  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;col&quot;&gt;
      &lt;h2&gt;&lt;i&gt;1&lt;/i&gt;자금 조달 구조&lt;/h2&gt;
      &lt;div class=&quot;box who eq&quot;&gt;&lt;div&gt;&lt;b&gt;대전시·대전도시공사&lt;/b&gt;&lt;span&gt;자본금 출자 · 최후순위&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;p&quot;&gt;20%&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;box who pf&quot;&gt;&lt;div&gt;&lt;b&gt;은행 PF 대출&lt;/b&gt;&lt;span&gt;18년 원리금 균등 · 선순위&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;p&quot;&gt;65%&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;box who ct&quot;&gt;&lt;div&gt;&lt;b&gt;대전 시민&lt;/b&gt;&lt;span&gt;P2P 연계대출 · 15년 원리금 균등&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;p&quot;&gt;15%&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;sbar&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;slab&quot;&gt;&lt;span&gt;출자 48억&lt;/span&gt;&lt;span&gt;PF 157억&lt;/span&gt;&lt;span&gt;시민 36억&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;lab&quot;&gt;기본 사업 규모&lt;/div&gt;
      &lt;div class=&quot;scale&quot;&gt;&lt;small&gt;후보 99곳 최대 규모 기준&lt;/small&gt;&lt;div class=&quot;n&quot;&gt;약 241억 원&lt;/div&gt;&lt;div class=&quot;d&quot;&gt;설비용량 최대 20.1MW · 실제 대상 확정 시 축소 가능&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;memo&quot;&gt;※ 기본 비율은 가정안. 은행은 DSCR 기준(1.2)을 충족하는 범위에서 PF를 제공하며, 보수 시나리오에서는 PF 50% + 출자 35% 조정이 필요&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;col&quot;&gt;
      &lt;h2&gt;&lt;i&gt;2&lt;/i&gt;사업 수익 및 현금흐름&lt;/h2&gt;
      &lt;div class=&quot;flow2&quot;&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;b&gt;공공건물 옥상&lt;/b&gt;&lt;span&gt;학교 중심 판매형&lt;br&gt;예산 초과 청사는 조건부 PPA&lt;/span&gt;&lt;/div&gt;
        &lt;em&gt;→&lt;/em&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;b&gt;SPC 설치·운영&lt;/b&gt;&lt;span&gt;태양광 발전 및 설비 유지관리&lt;br&gt;운영비·옥상 사용료 발생&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;two&quot;&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;b&gt;① 판매형&lt;/b&gt;&lt;span&gt;계약시장 경쟁입찰 → 한전과 20년 고정가격 계약&lt;br&gt;기준 단가 146.92원/kWh&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;box&quot;&gt;&lt;b&gt;② 온사이트 PPA&lt;/b&gt;&lt;span&gt;청사가 전기를 직접 구매&lt;br&gt;판매 기준가격 ≤ PPA 가격 ≤ 청사 전기요금&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;lab&quot;&gt;현금 배분 순서 · Cash Waterfall&lt;/div&gt;
      &lt;div class=&quot;wf&quot;&gt;
        &lt;div&gt;&lt;i&gt;1&lt;/i&gt;운영비·옥상 사용료&lt;/div&gt;&lt;div&gt;&lt;i&gt;2&lt;/i&gt;은행 PF 원리금&lt;/div&gt;
        &lt;div&gt;&lt;i&gt;3&lt;/i&gt;DSRA 적립·유지&lt;/div&gt;&lt;div&gt;&lt;i&gt;4&lt;/i&gt;시민 원리금&lt;/div&gt;
        &lt;div&gt;&lt;i&gt;5&lt;/i&gt;유지보수 적립&lt;/div&gt;&lt;div&gt;&lt;i&gt;6&lt;/i&gt;철거·원상복구 적립&lt;/div&gt;
        &lt;div class=&quot;w&quot;&gt;&lt;i&gt;7&lt;/i&gt;출자자 배당 및 대전시 기금 등 공공 환원&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;memo&quot;&gt;신규 설비 REC 수익은 반영하지 않음. 판매형은 발전량에 따라 매출이 변동하며, 판매단가만 계약기간 동안 고정&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;col&quot;&gt;
      &lt;h2&gt;&lt;i&gt;3&lt;/i&gt;상환 계획 및 사업성&lt;/h2&gt;
      &lt;div class=&quot;kpi&quot;&gt;
        &lt;div&gt;&lt;b&gt;1.83&lt;/b&gt;&lt;span&gt;기본안 1년차 DSCR&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;1.69&lt;/b&gt;&lt;span&gt;1~15년차 최저 DSCR&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;18년&lt;/b&gt;&lt;span&gt;은행 PF 상환기간&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;15년&lt;/b&gt;&lt;span&gt;시민 P2P 상환기간&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;lab&quot;&gt;20년 상환 타임라인 · 기본 시나리오&lt;/div&gt;
      &lt;div class=&quot;tl&quot;&gt;
        &lt;div&gt;&lt;b&gt;1~15년차&lt;/b&gt;&lt;span&gt;은행 PF 연 13.41억 + 시민 연 3.97억 상환&lt;br&gt;&lt;strong&gt;연간 합계 약 17.38억 원&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;16~18년차&lt;/b&gt;&lt;span&gt;시민 상환 종료 · 은행 PF만 상환&lt;br&gt;&lt;strong&gt;DSCR 약 2.18&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;19~20년차&lt;/b&gt;&lt;span&gt;차입금 상환 완료&lt;br&gt;&lt;strong&gt;연 순수익 약 28.6~28.8억 원 → 출자자·대전시 기금&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;lab&quot;&gt;핵심 관리 포인트&lt;/div&gt;
      &lt;div class=&quot;memo&quot;&gt;발전량·설치비·금리 확정 전 시나리오 검증 필수. 보수안 DSCR 1.04는 기준 미달이며, 스트레스안 0.81은 상환 불가 수준&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;risk&quot;&gt;&lt;b&gt;주요 위험 및 대응&lt;/b&gt;&lt;span&gt;계약시장 미낙찰·가격 하락 → 입찰 회차 분산 및 착공 조정 &amp;nbsp;|&amp;nbsp; 발전량 부족 → 보수 시나리오·DSRA 유지 &amp;nbsp;|&amp;nbsp; 설치비·금리 상승 → 착공 전 견적·금리 확정 &amp;nbsp;|&amp;nbsp; 시민 후순위 위험 → 상환순위 명확 고지 및 별도 적립 검토&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/body&gt;&lt;/html&gt;

&lt;html lang=&quot;ko&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;title&gt;S7 시민 투자와 시연&lt;/title&gt;
&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap&quot;&gt;
&lt;style&gt;
/* 발표 슬라이드 공통 — 설계도 디자인 시스템(1920×1080, 다크 네이비, 강조 앰버 1색) */
:root{--bg:#0E1620;--ink:#E8EDF2;--ink2:#A7B5C4;--amber:#E9A64A;--blue:#79B0D8;--warn:#E0786B;--line:#24313F;--card:#141F2B}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg)}
body{width:1920px;height:1080px;overflow:hidden;font-family:&quot;Noto Sans KR&quot;,sans-serif;color:var(--ink)}
.slide{position:relative;width:1920px;height:1080px;padding:100px 120px 80px;display:flex;flex-direction:column;gap:28px}
.mono{font-family:&quot;IBM Plex Mono&quot;,&quot;Noto Sans KR&quot;,monospace;font-variant-numeric:tabular-nums}
.hl{color:var(--amber)}
.part{position:absolute;top:44px;right:120px;font-size:20px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:6px 16px}
h1{font-size:54px;font-weight:700;line-height:1.25;letter-spacing:-.01em;max-width:1500px}
.sub{font-size:26px;color:var(--ink2);margin-top:-12px}
.grid2{display:grid;grid-template-columns:560px 1fr;gap:72px;align-items:center;flex:1;margin-top:-20px}
.killer .big{font-size:200px;font-weight:600;line-height:1}
.killer .big small{font-size:96px}
.killer .calc{font-size:26px;color:var(--ink2);margin-top:18px}
.killer .lab{font-size:24px;color:var(--ink2);margin-top:8px}
.bars{display:grid;gap:26px}
.bars .row{display:grid;grid-template-columns:90px 1fr 150px;align-items:center;gap:24px;font-size:30px}
.bars .nm{color:var(--ink2)}
.bars .track{position:relative;height:42px;background:#1A2633;border-radius:4px;overflow:visible}
.bars .track i{display:block;height:100%;background:#4A5B6D;border-radius:4px}
.bars .row.me .track i{background:var(--amber)}
.bars .row.me .nm{color:var(--ink);font-weight:700}
.bars b{font-size:32px;text-align:right}
.bars .cut{position:absolute;left:70%;top:-6px;font-size:40px;font-style:normal;color:var(--bg);font-weight:700;background:none}
.bars .axis{font-size:18px;color:var(--ink2);margin-top:4px}
.band{border-left:6px solid var(--amber);background:var(--card);padding:22px 28px;font-size:28px;line-height:1.45}
.src{position:absolute;left:120px;right:120px;bottom:36px;font-size:16px;color:#7E8D9C}
/* S8 */
.s8{display:grid;grid-template-columns:1fr 1fr;gap:56px;flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:36px 40px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.panel h2{font-size:26px;font-weight:500;color:var(--ink2)}
.total{display:flex;align-items:baseline;gap:20px}
.total .n{font-size:120px;font-weight:600;line-height:1;color:var(--amber)}
.total .u{font-size:44px;color:var(--amber)}
.total .t{font-size:26px;color:var(--ink2)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.split&gt;div{border-top:1px solid var(--line);padding-top:16px}
.split .k{font-size:22px;color:var(--ink2)}
.split .v{font-size:52px;font-weight:600;margin-top:4px}
.split .d{font-size:21px;color:var(--ink2);margin-top:10px;line-height:1.5}
.cmp{display:grid;gap:14px}
.cmp .row{display:grid;grid-template-columns:200px 1fr 110px;align-items:center;gap:18px;font-size:26px}
.cmp .row span{color:var(--ink2)}
.cmp .track{height:40px;background:#1A2633;border-radius:4px}
.cmp .track i{display:block;height:100%;border-radius:4px;background:#4A5B6D}
.cmp .row.ai .track i{background:var(--amber)}
.cmp .row.ai span{color:var(--ink);font-weight:700}
.cmp .row.blue .track i{background:var(--blue)}
.cmp b{font-size:30px;text-align:right}
.note{font-size:19px;color:var(--ink2);line-height:1.5}
.limits{background:rgba(224,120,107,.10);border:1px solid rgba(224,120,107,.45);border-radius:12px;padding:20px 28px;display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:28px;align-items:start;font-size:21px;line-height:1.45}
.limits strong{color:var(--warn);font-size:22px;white-space:nowrap}
.limits div b{color:var(--ink)}

/* ── 공통 부품 (S1·S3~S11) ── */
.muted{color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 30px}
.card h3{font-size:24px;font-weight:700;margin-bottom:10px}
.card p,.card li{font-size:22px;line-height:1.5;color:var(--ink2)}
.card ul{padding-left:22px;display:grid;gap:6px}
.tag{display:inline-block;font-size:18px;font-weight:700;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);margin-bottom:12px}
.tag.ok{color:#7FC49A;border-color:#2E5A40}
.tag.warn{color:var(--warn);border-color:rgba(224,120,107,.5)}
.tag.amber{color:var(--amber);border-color:rgba(233,166,74,.5)}
.dim{opacity:.55}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.big{font-family:&quot;IBM Plex Mono&quot;,&quot;Noto Sans KR&quot;,monospace;font-weight:600;color:var(--amber);line-height:1}
.empty{border:2px dashed #46596C;border-radius:12px;padding:26px 30px;background:none}
.empty h3{color:var(--amber)}
.band2{border-left:6px solid var(--amber);background:var(--card);padding:18px 26px;font-size:26px;line-height:1.45}
.flow{display:flex;align-items:stretch;gap:0}
.flow .st{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.flow .st b{display:block;font-size:24px;margin-bottom:6px}
.flow .st span{font-size:19px;color:var(--ink2);line-height:1.45}
.flow .ar{width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--amber);font-size:30px;font-weight:700}
.flow .ar small{font-size:15px;color:var(--ink2);font-weight:500;white-space:nowrap}
.img{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0A1018}
.img img{display:block;width:100%;height:100%;object-fit:cover}
.cap{font-size:17px;color:var(--ink2);margin-top:8px}

<script>
const P=[...document.querySelectorAll(".pg")], nav=document.getElementById("nav");
const fit=()=>{const k=Math.min(innerWidth/1920,innerHeight/1080);document.querySelectorAll(".fit").forEach(f=>f.style.transform=`scale(${k})`);};
addEventListener("resize",fit); fit();
const cur=()=>{let b=0,d=1e9;P.forEach((p,i)=>{const t=Math.abs(p.getBoundingClientRect().top);if(t<d){d=t;b=i;}});return b;};
const go=i=>P[Math.max(0,Math.min(P.length-1,i))].scrollIntoView({behavior:"smooth"});
addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){e.preventDefault();go(cur()+1);}
  else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(cur()-1);}
  else if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  else if(e.key==="Home")go(0); else if(e.key==="End")go(P.length-1);
});
addEventListener("scroll",()=>{nav.textContent=`${cur()+1} / ${P.length} · ← → 넘기기 · F 전체화면`;},{passive:true});
</script>
